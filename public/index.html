// ── Graphiques (Chart.js) ──
let charts = [];
function tipHandler(el, build) {
  return ({ chart, tooltip }) => {
    if (!el) return;
    if (!tooltip || tooltip.opacity === 0 || !tooltip.dataPoints?.length) { el.hidden = true; return; }
    el.innerHTML = build(tooltip.dataPoints[0]);
    el.hidden = false;
    const half = el.offsetWidth / 2;
    el.style.left = Math.min(Math.max(tooltip.caretX, half + 4), chart.width - half - 4) + "px";
    el.style.top = tooltip.caretY + "px";
    el.classList.toggle("below", tooltip.caretY < el.offsetHeight + 20);
  };
}
const noteTip = (dp) => { const r = dp.raw, n = r.n; return `<p class="tip-s">${dot(n.matiere)}${esc(n.matiere)}</p><p class="tip-m">${dShort(n.date)} · ${esc(n.devoir)}</p>
  <div class="tip-row"><span>Note<b>${fmtRaw(n.note)}/${fmtRaw(n.sur)}</b></span><span>Moyenne<b>${fmt(r.avg)}</b></span></div>`; };

function drawCharts() {
  charts.forEach((c) => c.destroy()); charts = [];
  const canvases = document.querySelectorAll("canvas");
  if (!canvases.length) return;
  if (!window.Chart) { document.querySelectorAll(".chart").forEach((el) => el.classList.add("is-off")); document.querySelectorAll("details.data").forEach((d) => d.open = true); return; }
  const cs = getComputedStyle(root), v = (n) => cs.getPropertyValue(n).trim();

// ── Emploi du temps (PRONOTE) ──
const hm = (s) => s.slice(11, 16).replace(":", "h");
function vEdt() {
  const list = DATA?.edt ?? [];
  const changed = list.filter((c) => c.annule || c.statut).length, tests = list.filter((c) => c.controle).length;
  let h = `<div class="page-h"><h1 tabindex="-1">Emploi du temps</h1><p class="lede">${list.length ? `${pl(list.filter((c) => !c.annule).length, "cours", "cours")} sur les 7 prochains jours${changed ? `, ${pl(changed, "changement", "changements")}` : ""}${tests ? `, ${pl(tests, "contrôle annoncé", "contrôles annoncés")}` : ""}.` : ""}</p></div>${notices()}`;
  if (!list.length) return h + `<section class="card empty rise"><h2>Aucun cours sur les 7 prochains jours</h2><p>Vacances, ou emploi du temps pas encore publié sur PRONOTE.</p></section>`;
  const byDay = new Map();
  for (const c of list) (byDay.get(c.debut.slice(0, 10)) ?? byDay.set(c.debut.slice(0, 10), []).get(c.debut.slice(0, 10))).push(c);
  return h + `<div class="hw-main">${[...byDay].map(([d, cs], i) => `<section class="card hw-g rise" style="--i:${i + 1}" aria-labelledby="edt-${d}">
    <h2 id="edt-${d}" class="g-title">${d === TODAY ? "Aujourd'hui" : d === addDays(TODAY, 1) ? "Demain" : esc(dLong(d).replace(/^./, (x) => x.toUpperCase()))}<span class="g-n">${cs.filter((c) => !c.annule).length}</span></h2>
    <p class="t-meta">${dFull(d)} · ${hm(cs[0].debut)} – ${hm(cs.at(-1).fin)}</p>
    <ul class="hw-list">${cs.map((c) => `<li class="hw${c.annule ? " is-done" : ""}" style="--c:${c.autre ? "var(--muted)" : `var(--subject-${sIdx(c.matiere) % 7 + 1})`}">${c.autre ? '<i class="dot" aria-hidden="true"></i>' : dot(c.matiere)}
      <div><p class="hw-s num">${hm(c.debut)} – ${hm(c.fin)}</p><p class="hw-t">${esc(c.matiere)}</p>
      <p class="hw-d">${[c.salle && "Salle " + esc(c.salle), c.prof && esc(c.prof)].filter(Boolean).join(" · ")}</p></div>
      <div class="hw-x">${c.annule ? `<span class="badge b-down">${ICON.few}Annulé</span>` : ""}${c.statut && !c.annule ? `<span class="badge b-down">${ICON.few}${esc(c.statut)}</span>` : c.statut ? `<span class="t-meta">${esc(c.statut)}</span>` : ""}${c.controle ? `<span class="badge b-exam">${ICON.exam}Contrôle</span>` : ""}</div></li>`).join("")}</ul></section>`).join("")}</div>`;
}

// ── Vie scolaire (PRONOTE) ──
function vVie() {
  const v = DATA?.vieScolaire ?? { absences: [], retards: [], punitions: [], observations: [] };
  const fmtH = (x) => { const hh = Math.floor(x), mm = Math.round((x - hh) * 60); return `${hh} h${mm ? String(mm).padStart(2, "0") : ""}`; };
  const heures = v.absences.reduce((t, a) => t + (a.heures || 0), 0);
  const nj = v.absences.filter((a) => !a.justifiee).length, rj = v.retards.filter((r) => !r.justifie).length;
  const enc = v.observations.filter((o) => o.genre === "encouragement").length;
  const kpi = (l, n, sub, warn) => `<div class="card kpi m-6 l-3 rise"><p class="t-label">${l}</p><p class="kpi-v">${n}</p><p class="t-meta">${sub}</p>${warn ? `<span class="badge b-down">${ICON.few}${warn}</span>` : ""}</div>`;
  const row = (color, title, meta, badges = "", detail = "") => `<li class="hw" style="--c:${color}"><i class="dot" aria-hidden="true"></i><div><p class="hw-t">${title}</p>${detail ? `<p class="t-meta">${detail}</p>` : ""}<p class="hw-d">${meta}</p></div><div class="hw-x">${badges}</div></li>`;
  const ok = (t) => `<span class="badge b-done">${ICON.done}${t}</span>`, ko = (t) => `<span class="badge b-down">${ICON.few}${t}</span>`;
  const sec = (id, title, items, empty) => `<section class="card hw-g rise" aria-labelledby="vs-${id}"><h2 id="vs-${id}" class="g-title">${title}<span class="g-n">${items.length}</span></h2>
    ${items.length ? `<ul class="hw-list">${items.join("")}</ul>` : `<p class="t-meta">${empty}</p>`}</section>`;
  const span = (a) => a.debut.slice(0, 10) === a.fin.slice(0, 10) ? `${dDay(a.debut.slice(0, 10))}, ${hm(a.debut)} – ${hm(a.fin)}` : `Du ${dDay(a.debut.slice(0, 10))} au ${dDay(a.fin.slice(0, 10))}`;
  return `<div class="page-h"><h1 tabindex="-1">Vie scolaire</h1><p class="lede">Absences, retards, punitions et observations de l'année sur PRONOTE.</p></div>${notices()}
    <div class="grid">${kpi("Absences", v.absences.length, `${fmtH(heures)} manquées`, nj ? `${nj} non justifiée${nj > 1 ? "s" : ""}` : "")}
    ${kpi("Retards", v.retards.length, v.retards.length ? `${v.retards.reduce((t, r) => t + (r.minutes || 0), 0)} min au total` : "Aucun retard", rj ? `${rj} non justifié${rj > 1 ? "s" : ""}` : "")}
    ${kpi("Punitions", v.punitions.length, v.punitions[0] ? `Dernière le ${dShort(v.punitions[0].date)}` : "Aucune punition")}
    ${kpi("Encouragements", enc, `${pl(v.observations.length - enc, "autre observation", "autres observations")}`)}</div>
    <div class="hw-main">
    ${sec("abs", "Absences", v.absences.map((a) => row("var(--warn)", esc(a.motif || "Motif non précisé"), `${span(a)} · ${fmtH(a.heures || 0)}`, a.justifiee ? ok("Justifiée") : ko(a.aJustifier ? "À justifier" : "Non justifiée"))), "Aucune absence cette année.")}
    ${sec("ret", "Retards", v.retards.map((r) => row("var(--warn)", `${r.minutes} min`, `${dDay(r.date.slice(0, 10))}, ${hm(r.date)}`, r.justifie ? ok("Justifié") : ko("Non justifié"), esc(r.motif))), "Aucun retard cette année.")}
    ${sec("pun", "Punitions", v.punitions.map((p) => row("var(--bad)", esc(p.titre), `${dDay(p.date)}${p.par ? " · " + esc(p.par) : ""}${p.duree ? " · " + p.duree + " min" : ""}`, "", esc([p.motifs, p.travail].filter(Boolean).join(" — ")))), "Aucune punition cette année.")}
    ${sec("obs", "Observations et encouragements", v.observations.map((o) => row(o.genre === "encouragement" ? "var(--good)" : "var(--accent)", esc(o.titre), `${dDay(o.date)}${o.matiere ? " · " + esc(o.matiere) : ""}`, o.genre === "encouragement" ? ok("Encouragement") : "", esc(o.texte))), "Aucune observation cette année.")}
    </div>`;
}

// ── Navigation et rendu ──
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("matiere/")) return { v: "matiere", s: h.slice(8) };
  if (h === "devoirs") return { v: "devoirs" };
  if (h === "edt" && DATA?.edt) return { v: "edt" };
  if (h === "vie" && DATA?.vieScolaire) return { v: "vie" };
  return { v: "accueil" };
}
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;

function render() {
  const r = route(), page = r.v === "accueil";
  cur = stats(state.p);
  $("#top").classList.toggle("is-page", page);
  const nm = DATA?.eleve || "Bienvenue";
  $("#who").innerHTML = `<span class="avatar" aria-hidden="true">${esc((DATA?.prenom || ELEVE?.nom || nm).trim().charAt(0).toUpperCase())}</span><div class="who-t">
    <p class="t-label">Carnet de bord</p>${MULTI && MULTI.eleves.length > 1 ? `<label class="who-sel"><span class="sr-only">Élève</span><select id="eleve-sel">${MULTI.eleves.map((e) =>

    <p class="t-meta">${DATA ? `${DATA.classe ? esc(DATA.classe) + " · " : ""}mis à jour le ${dShort(TODAY).replace(/^0/, "")}${DATA.exemple ? ` · <span class="tag">exemple</span>` : ""}` : "Aucune donnée"}</p></div>`;
  const urgent = weekNumbers().urgent;
  const cur_ = (v) => (r.v === v ? ' aria-current="page"' : "");
  const vsAlert = DATA?.vieScolaire ? DATA.vieScolaire.absences.filter((a) => a.aJustifier).length + DATA.vieScolaire.retards.filter((x) => !x.justifie && D(x.date.slice(0, 10)) >= D(addDays(TODAY, -14))).length : 0;
  $("#tabs").innerHTML = `<a class="tab" href="#"${r.v === "accueil" || r.v === "matiere" ? ' aria-current="page"' : ""}>Accueil</a>
    <a class="tab" href="#devoirs"${cur_("devoirs")}>Devoirs${urgent ? ` <span class="count" aria-label="${urgent} pour demain ou en retard">${urgent}</span>` : ""}</a>${DATA?.edt ? `
    <a class="tab" href="#edt"${cur_("edt")}><span class="tl-l">Emploi du temps</span><span class="tl-s">Cours</span></a>` : ""}${DATA?.vieScolaire ? `
    <a class="tab" href="#vie"${cur_("vie")}><span class="tl-l">Vie scolaire</span><span class="tl-s">Vie sco.</span>${vsAlert ? ` <span class="count" aria-label="${vsAlert} à justifier ou récent">${vsAlert}</span>` : ""}</a>` : ""}`;
  $("#theme").setAttribute("aria-label", isDark() ? "Passer au thème clair" : "Passer au thème sombre");
  const main = $("#main");
  main.removeAttribute("aria-busy");
  main.innerHTML = r.v === "devoirs" ? vDevoirs() : r.v === "matiere" ? vMatiere(r.s) : r.v === "edt" ? vEdt() : r.v === "vie" ? vVie() : vAccueil();
  $("#eleve-sel")?.addEventListener("change", (e) => {

document.addEventListener("click", (e) => {

  else if (b.dataset.filter) { state.f = b.dataset.filter; render(); $(`[data-filter="${state.f}"]`)?.focus(); }
  else {

    const ch = charts.find((c) => c.canvas.id === "c-trend"), i = ch?.data.datasets.findIndex((d) => d.label === name);
    if (ch && i >= 0) { ch.setDatasetVisibility(i, on); ch.update(); }

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); $("main h1, #who h1")?.focus({ preventScroll: true }); });
$("#theme").addEventListener("click", () => {

matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (!root.dataset.theme) render(); });

// ── Widgets déplaçables : clic gauche maintenu (ou toucher long) puis glisser ──
const ORDER_KEY = "carnet-ordre";
// Ordre : fichier data/layout.json (via le mini-serveur) en priorité, sinon navigateur
const lsGet = () => { try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch (e) { return []; } };
const lsSet = (a) => { try { a ? localStorage.setItem(ORDER_KEY, JSON.stringify(a)) : localStorage.removeItem(ORDER_KEY); } catch (e) {} };
const saveRemote = (a) => fetch("/api/layout", { method: "POST", headers: { "X-Vie-Scolaire": "1", "Content-Type": "application/json" }, body: JSON.stringify(a || []) }).catch(() => {});
let ORDER = Array.isArray(DATA?.layout) && DATA.layout.length ? DATA.layout : lsGet();
const getOrder = () => ORDER;
const setOrder = (a) => { ORDER = a || []; lsSet(a); saveRemote(a); };
// Première fois : l'arrangement déjà fait dans ce navigateur devient l'ordre par défaut du serveur
if (!(DATA?.layout || []).length && ORDER.length) saveRemote(ORDER);
const WSEL = "#main .grid>[data-w]";

function tagWidgets() {
  const g = $("#main .grid");
  if (!g || route().v !== "accueil") return;
  [...g.children].forEach((el, i) => {
    el.dataset.w = el.getAttribute("aria-labelledby") || (el.querySelector(".t-label")?.textContent.trim()) || `w${i}`;
    el.dataset.t = (el.querySelector("h2, .t-label")?.textContent || "Bloc").trim();
  });
  const ord = getOrder();
  [...g.children].map((el, i) => [el, ord.indexOf(el.dataset.w) >= 0 ? ord.indexOf(el.dataset.w) : 1000 + i])
    .sort((a, b) => a[1] - b[1]).forEach(([el]) => g.appendChild(el));
  g.insertAdjacentHTML("afterend", `<p class="t-meta drag-hint">Astuce : maintenez le clic gauche sur un bloc pour le déplacer. <button type="button" class="linkbtn" data-reset-order>Réinitialiser l'ordre</button></p>`);
}

(() => {
  let st = null, swallow = false, scroller = null;
  const HOLD = 220;
  const ids = () => [...document.querySelectorAll(WSEL)].map((e) => e.dataset.w);

  function start() {
    if (!st || st.active) return;
    st.active = true; clearTimeout(st.timer);
    // Les animations d'entrée ne doivent pas se rejouer quand un bloc change de place
    document.querySelectorAll(WSEL).forEach((e) => e.classList.remove("rise"));
    st.el.classList.add("drag-src");
    st.ghost = document.createElement("div");
    st.ghost.className = "drag-ghost"; st.ghost.textContent = st.el.dataset.t;
    document.body.append(st.ghost);
    document.body.classList.add("dragging");
    navigator.vibrate?.(12);
    place();
    scroller = setInterval(() => { if (st?.y < 70) scrollBy(0, -16); else if (st && st.y > innerHeight - 70) scrollBy(0, 16); hit(); }, 30);
  }
  function place() { if (st?.ghost) st.ghost.style.transform = `translate(${st.x + 14}px, ${st.y + 14}px)`; }
  function hit() {
    if (!st?.active) return;
    const t = document.elementsFromPoint(st.x, st.y).map((n) => n.closest?.(WSEL)).find((n) => n && n !== st.el);
    if (!t) return;
    const g = t.parentElement, r = t.getBoundingClientRect(), wide = r.width > g.getBoundingClientRect().width * 0.7;
    const before = wide ? st.y < r.top + r.height / 2 : st.x < r.left + r.width / 2;
    const ref = before ? t : t.nextSibling;
    if (ref !== st.el && st.el.nextSibling !== ref) g.insertBefore(st.el, ref);
  }
  function end(cancel) {
    if (!st) return;
    clearTimeout(st.timer); clearInterval(scroller);
    if (st.active) {
      st.el.classList.remove("drag-src"); st.ghost?.remove(); document.body.classList.remove("dragging");
      if (!cancel) setOrder(ids());
      swallow = true; setTimeout(() => (swallow = false), 0);
    }
    st = null;
  }

  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const el = e.target.closest?.(WSEL);
    if (!el || e.target.closest("button, summary, input, select, textarea, .legend, .tip")) return;
    st = { el, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, mouse: e.pointerType === "mouse" };
    st.timer = setTimeout(start, HOLD);
  });
  document.addEventListener("pointermove", (e) => {
    if (!st) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.active) {
      if (Math.hypot(st.x - st.x0, st.y - st.y0) > 8) { st.mouse ? start() : (clearTimeout(st.timer), (st = null)); }
      return;
    }
    place(); hit();
  });
  document.addEventListener("pointerup", () => end(false));
  document.addEventListener("pointercancel", () => end(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && st?.active) end(true); });
  // Empêche : glisser-déposer natif des liens, défilement tactile et menu contextuel pendant le déplacement
  document.addEventListener("dragstart", (e) => { if (e.target.closest?.(WSEL)) e.preventDefault(); });
  document.addEventListener("touchmove", (e) => { if (st?.active) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", (e) => { if (st && e.target.closest?.(WSEL)) e.preventDefault(); });
  document.addEventListener("click", (e) => { if (swallow) { e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener("click", (e) => { if (e.target.closest?.("[data-reset-order]")) { setOrder(null); render(); } });
})();

// ── Actions locales : npm run sync / npm run resume via le mini-serveur (npm run serve) ──
(() => {
  const box = $("#actions"), toast = $("#toast"), dlg = $("#synth");
  let timer;
  const say = (m, ms = 6000) => { toast.textContent = m; toast.hidden = false; clearTimeout(timer); if (ms) timer = setTimeout(() => (toast.hidden = true), ms); };
  const api = (path, post) => fetch(path, { method: post ? "POST" : "GET", headers: { "X-Vie-Scolaire": "1" } }).then((r) => r.json());
  fetch("/api/ping", { headers: { "X-Vie-Scolaire": "1" } }).then((r) => r.ok && r.json()).then((j) => { if (j?.ok) box.hidden = false; }).catch(() => {});

  $("#act-sync").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.classList.add("busy");
    say("Mise à jour en cours (notes et devoirs sur 21 jours)…", 0);
    try {
      const r = await api("/api/sync", true);
      if (r.ok) { say("Données à jour. Rechargement…", 0); setTimeout(() => location.reload(), 600); return; }
      say(r.error || "La mise à jour a échoué.", 10000);
    } catch { say("Serveur local injoignable : relancez npm run serve.", 10000); }
    b.disabled = false; b.classList.remove("busy");
  });
  $("#act-resume").addEventListener("click", async () => {
    try {
      const r = await api("/api/resume");
      $("#synth-body").textContent = r.text || "Aucune synthèse : cliquez sur Actualiser.";
      dlg.showModal();
    } catch { say("Serveur local injoignable : relancez npm run serve.", 10000); }
  });
  $("#synth-close").addEventListener("click", () => dlg.close());

  // Accès mobile : QR code vers l'adresse du PC sur le réseau local (npm run serve:mobile)
  const mob = $("#mob"), mbody = $("#mob-body");
  $("#mob-close").addEventListener("click", () => mob.close());
  $("#act-mobile").addEventListener("click", async () => {
    mbody.textContent = "…"; mob.showModal();
    let r; try { r = await api("/api/mobile"); } catch { mbody.textContent = "Serveur local injoignable."; return; }
    if (!r.enabled || !r.urls?.length) {
      mbody.innerHTML = `<p>L'accès mobile est désactivé. Arrêtez le serveur puis lancez <b>npm run serve:mobile</b>, et cliquez de nouveau sur Mobile.</p>`;
      return;
    }
    const u = r.urls[0];
    mbody.innerHTML = `<p>Sur le même Wi-Fi que ce PC, scannez ce code avec l'appareil photo du téléphone.</p><div id="qr" style="display:grid;place-items:center;padding:12px;background:#fff;border-radius:16px;width:max-content;margin:12px auto"></div>
      <p class="t-meta">Ou saisissez : <code></code></p><p class="t-meta">Le lien contient une clé personnelle : ne le partagez pas. Il ne fonctionne qu'à la maison, PC allumé.</p>`;
    mbody.querySelector("code").textContent = u;
    const draw = () => new QRCode($("#qr"), { text: u, width: 200, height: 200 });
    if (window.QRCode) draw(); else { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; sc.onload = draw; sc.onerror = () => ($("#qr").textContent = "QR indisponible : saisissez l'adresse."); document.head.append(sc); }
  });
})();

if (APERCU !== "chargement") (document.fonts?.ready ?? Promise.resolve()).then(render, render);
</script>
</body>
</html>
