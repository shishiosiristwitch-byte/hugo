<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f3fc4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
.vs-form{display:grid;gap:var(--sp-3)}
.vs-form label{display:grid;gap:var(--sp-1);font-weight:700;font-size:.9rem}
.vs-form input:not([type=checkbox]){min-height:48px;padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--r-1);background:var(--surface-2);color:var(--fg);font:inherit;font-size:16px}
.vs-form input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vs-form .vs-check{display:flex;align-items:center;gap:var(--sp-2);font-weight:600}
.vs-form .vs-check input{width:20px;height:20px;accent-color:var(--accent)}
.vs-err{margin:0;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-1);background:var(--bad-bg);color:var(--bad);font-weight:600}
.vs-choices{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.vs-login::backdrop{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
@media (max-width:899px){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
</style>
